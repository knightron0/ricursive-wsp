[project]
name = "ripple-wsp"
version = "0.1.0"
description = "Weight-space programming on CIFAR-10 with an LLM agent (Ripple-65B via OpenRouter, or any agent through files), in several regimes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2", "torch>=2.5"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2"
pytorch-cpu = ">=2.5"

[tool.pixi.tasks]
wsp = "python -m ripple_wsp"
